# /etc/nginx/sites-available/citylegend.art

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name citylegend.art www.citylegend.art;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name citylegend.art www.citylegend.art;

    ssl_certificate     /etc/letsencrypt/live/citylegend.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citylegend.art/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Max upload size (matches Next.js serverActions bodySizeLimit)
    client_max_body_size 100M;

    # Static Next.js assets — long-lived cache
    location /_next/static/ {
        alias /var/www/citylegend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public uploads — medium cache
    location /uploads/ {
        alias /var/www/citylegend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Other static public files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|avif|mp4|webm|pdf|woff2|woff|ttf|otf)$ {
        root /var/www/citylegend/public;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri @nextjs;
    }

    # Proxy all other requests to Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    location @nextjs {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Block direct access to sensitive paths
    location ~ /\.ht {
        deny all;
    }
    location ~ /\.git {
        deny all;
    }
}
